<!DOCTYPE html>
<html lang="es" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nails Studio | Uñas impecables con acabado premium</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script>

            theme: {

                    fontFamily: {
                        sans: ['Manrope', 'sans-serif'],

                    colors: {
                        blush: '#fff6fb',
                        rosegold: '#c28888',
                        berry: '#9d174d',
                        ink: '#24111a'
                    },
                    boxShadow: {
                        soft: '0 25px 70px rgba(157, 23, 77, 0.12)',

            }
        };

        <div id="navbar"></div>
